name: Plan lineup schedule

on:
  schedule:
    # 11:23 UTC is 4:23 a.m. in Phoenix, which is UTC-7 all year.
    - cron: "23 11 * * *"
  workflow_dispatch:

# The default GITHUB_TOKEN cannot change files under .github/workflows, so the
# commit uses WORKFLOW_TOKEN: a fine-grained personal access token with
# Contents: read/write and Workflows: read/write on this repository.
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Runs before checkout, which needs the token. Without this check, a missing
      # secret fails inside checkout with a generic auth error.
      - name: Check WORKFLOW_TOKEN is set
        env:
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          if [ -z "$WORKFLOW_TOKEN" ]; then
            echo "::error::Add a WORKFLOW_TOKEN secret (fine-grained PAT with Contents and Workflows write access)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rewrite lineup schedule
        run: node plan-schedule.js

      - name: Commit if the schedule changed
        run: |
          if git diff --quiet -- .github/workflows/lineup.yml; then
            echo "Schedule unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/lineup.yml
          git commit -m "Update lineup schedule"
          git push
